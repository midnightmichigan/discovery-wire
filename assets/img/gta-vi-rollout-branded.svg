<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#150b2e"/>
<stop offset="0.55" stop-color="#3b1155"/>
<stop offset="1" stop-color="#8e2a63"/>
